name: CI

on:
  push:
    branches: [main, "demo/**"]
  pull_request:
    branches: [main, "demo/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets anywhere in this workflow: the app must pass in demo mode (fake providers).
env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: flake8 (config in .flake8; legacy files have scoped ignores)
        run: flake8 .
      - name: black
        run: black --check --diff .
      - name: mypy (petpulse/)
        run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Assert no provider keys are present
        run: |
          for var in OPENAI_API_KEY GOOGLE_APPLICATION_CREDENTIALS; do
            if [ -n "${!var:-}" ]; then echo "::error::$var must not be set in CI"; exit 1; fi
          done
      - name: pytest (known bugs are strict xfails; coverage floor in pyproject.toml)
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned tools
        run: pip install -r requirements-dev.txt
      - name: bandit (medium+ severity, new package)
        # Legacy modules have known findings (e.g. B108 = review C3) owned by the bug-fix track;
        # add each module here once it is fixed or replaced.
        run: bandit -ll -r petpulse
      - name: detect-secrets (fails on anything not in .secrets.baseline)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (base requirements only)
        run: docker build -t petpulse:ci .
      - name: Run with no env and poll /api/health
        run: |
          docker run -d --name petpulse -p 8000:8000 petpulse:ci
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:8000/api/health); then
              echo "$body"
              echo "$body" | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['mode']=='demo' and b['llm']=='fake' and b['stt']=='fake', b"
              exit 0
            fi
            sleep 1
          done
          docker logs petpulse
          exit 1
      - name: Demo login as Alice sees the seeded pets; anonymous is 401
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/me/pets)
          [ "$code" = "401" ] || { echo "::error::anonymous /api/me/pets returned $code"; exit 1; }
          token=$(curl -fsS -X POST http://localhost:8000/api/demo/login -H 'Content-Type: application/json' \
            -d '{"uid":"alice"}' | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          curl -fsS http://localhost:8000/api/me/pets -H "Authorization: Bearer $token" \
            | python3 -c "import json,sys; p=json.load(sys.stdin); n=sorted(x['name'] for x in p); assert n==['Luna','Max'], p; print(n)"
      - name: Container healthcheck turns healthy
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' petpulse)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs petpulse
          exit 1
      - name: Stop
        if: always()
        run: if docker inspect petpulse >/dev/null 2>&1; then docker rm -f petpulse; fi
