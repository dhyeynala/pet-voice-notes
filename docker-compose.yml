# Demo: `docker compose up` needs no .env and no secrets (fake AI providers, JSON store).
# Live: put OPENAI_API_KEY in .env (see .env.example); providers on `auto` switch to OpenAI.
# Reset demo data: `docker compose down -v`.
# `env_file.required: false` needs Docker Compose v2.24+.
services:
  app:
    build:
      context: .
      args:
        INSTALL_LIVE: ${INSTALL_LIVE:-false}
    image: petpulse:demo
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DEMO_MODE: "true"
      DATA_DIR: /app/data
    volumes:
      - demo-data:/app/data
    restart: unless-stopped

volumes:
  demo-data: {}
